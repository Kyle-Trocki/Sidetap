name: Sidetap
options:
  bundleIdPrefix: com.sidetap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SidetapCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Sidetap:
    type: application
    platform: macOS
    sources:
      - path: Sources/SidetapApp
      - path: Config/AppIcon.icns
        buildPhase: resources
    info:
      path: Config/Sidetap-Info.plist
      properties:
        CFBundleDisplayName: Sidetap
        CFBundleIconFile: AppIcon
        CFBundleName: Sidetap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMultipleInstancesProhibited: true
        NSMicrophoneUsageDescription: Sidetap listens for desk taps locally. Audio is discarded unless you explicitly enable debug recording.
        NSLocationUsageDescription: Sidetap uses your location to switch to the desk profile you set up there. Sidetap stores desk locations only on this Mac.
        NSLocationWhenInUseUsageDescription: Sidetap uses your location to switch to the desk profile you set up there. Sidetap stores desk locations only on this Mac.
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
    entitlements:
      path: Config/Sidetap.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.app
        PRODUCT_NAME: Sidetap
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: J7ZMYXJVRR
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
  SidetapCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SidetapCoreTests
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapCoreTests
        GENERATE_INFOPLIST_FILE: YES
  SidetapAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SidetapAppTests
      - path: Sources/SidetapApp/AppSection.swift
      - path: Sources/SidetapApp/GuidedNavigationGate.swift
      - path: Sources/SidetapApp/SensingStrategyResolver.swift
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapAppTests
        GENERATE_INFOPLIST_FILE: YES
  SidetapSoak:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SidetapSoak
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapSoak
        GENERATE_INFOPLIST_FILE: YES
  SidetapReplaySupport:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SidetapReplaySupport
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapReplaySupport
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SidetapReplay:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SidetapReplay
    dependencies:
      - target: SidetapCore
      - target: SidetapReplaySupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapReplay
        GENERATE_INFOPLIST_FILE: YES
  SidetapReplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SidetapReplayTests
    dependencies:
      - target: SidetapReplaySupport
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapReplayTests
        GENERATE_INFOPLIST_FILE: YES
  SidetapRouteCheck:
    type: tool
    platform: macOS
    sources:
      - path: Sources/SidetapRouteCheck
      - path: Sources/SidetapApp/SystemAudioRoute.swift
    dependencies:
      - target: SidetapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidetap.SidetapRouteCheck
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sidetap:
    build:
      targets:
        Sidetap: all
        SidetapCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SidetapCoreTests
        - SidetapAppTests
  SidetapSoak:
    build:
      targets:
        SidetapSoak: all
    run:
      config: Release
  SidetapReplay:
    build:
      targets:
        SidetapReplay: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - SidetapReplayTests
  SidetapRouteCheck:
    build:
      targets:
        SidetapRouteCheck: all
    run:
      config: Debug
